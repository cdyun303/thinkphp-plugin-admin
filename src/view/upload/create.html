<!DOCTYPE html>
<html lang="zh-cn">
<head>
		<meta charset="UTF-8">
		<title>新增页面</title>
		<link rel="stylesheet" href="__LIB__/pear/css/pear.css"/>
		<link rel="stylesheet" href="__ADMIN__/css/reset.css"/>
</head>
<body>

<form class="layui-form" action="">

		<div class="mainBox">
				<div class="main-container mr-5">

						<div class="layui-form-item">
								<label class="layui-form-label">类别</label>
								<div class="layui-input-block">
										<div name="category" id="category" value=""></div>
								</div>
						</div>

						<div class="layui-form-item">
								<label class="layui-form-label required">文件</label>
								<div class="layui-input-block">
										<span></span>
										<input type="text" style="display:none" name="url" value=""/>
										<button type="button" class="pear-btn pear-btn-primary pear-btn-sm" id="url">
												<i class="layui-icon layui-icon-upload"></i>上传文件
										</button>
								</div>
						</div>

				</div>
		</div>

</form>

<script src="__LIB__/layui/layui.js?v=2.8.12"></script>
<script src="__LIB__/pear/pear.js"></script>
<script src="__ADMIN__/js/permission.js"></script>
<script>

    // 字段 文件 url
    layui.use(["upload", "layer", "popup", "util", "responseCode"], function () {
        let input = layui.$("#url").prev();
        input.prev().html(layui.util.escape(input.val()));
        layui.upload.render({
            elem: "#url",
            accept: "file",
            data: {
                category: function () {
                    return layui.$('input[name="category"]').val();
                }
            },
            url: "/admin/core/upload/create",
            done: function (res) {
                if (res.code === layui.responseCode.ERROR) return layui.popup.failure(res.message);
                parent.refreshTable();
                parent.layer.close(parent.layer.getFrameIndex(window.name));
            }
        });
    });

    // 字段 类别 category
    layui.use(["jquery", "xmSelect", "responseCode"], function () {
        layui.$.ajax({
            url: "/admin/core/dict/get/upload",
            dataType: "json",
            success: function (res) {
                let value = layui.$("#category").attr("value");
                let initValue = value ? value.split(",") : [];
                layui.xmSelect.render({
                    el: "#category",
                    name: "category",
                    initValue: initValue,
                    data: res.data,
                    model: {"icon": "hidden", "label": {"type": "text"}},
                    clickClose: true,
                    radio: true,
                });
                if (res.code === layui.responseCode.ERROR) {
                    return layui.popup.failure(res.msg);
                }
            }
        });
    });

</script>

</body>
</html>
