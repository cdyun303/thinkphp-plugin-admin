<!DOCTYPE html>
<html lang="zh-cn">
<head>
		<meta charset="utf-8">
		<title>账号管理</title>
		<link rel="stylesheet" href="__LIB__/pear/css/pear.css"/>
		<link rel="stylesheet" href="__ADMIN__/css/reset.css"/>
</head>
<body class="pear-container">

<!-- 顶部查询表单 -->
<div class="layui-card">
		<div class="layui-card-body">
				<form class="layui-form top-search-from">

						<div class="layui-form-item">
								<label class="layui-form-label">用户名</label>
								<div class="layui-input-block">
										<input type="text" name="username" value="" class="layui-input">
								</div>
						</div>

						<div class="layui-form-item">
								<label class="layui-form-label">昵称</label>
								<div class="layui-input-block">
										<input type="text" name="nickname" value="" class="layui-input">
								</div>
						</div>

						<div class="layui-form-item">
								<label class="layui-form-label">状态</label>
								<div class="layui-input-block">
										<div name="status" id="status" value=""></div>
								</div>
						</div>

						<div class="layui-form-item">
								<label class="layui-form-label">创建时间</label>
								<div class="layui-input-block">
										<div class="layui-input-block" id="create_at">
												<input type="text" autocomplete="off" name="create_at[]" id="create_at-date-start"
												       class="layui-input inline-block" placeholder="开始时间">
												-
												<input type="text" autocomplete="off" name="create_at[]" id="create_at-date-end"
												       class="layui-input inline-block" placeholder="结束时间">
										</div>
								</div>
						</div>

						<div class="layui-form-item layui-inline">
								<label class="layui-form-label"></label>
								<button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="table-query">
										<i class="layui-icon layui-icon-search"></i>查询
								</button>
								<button type="reset" class="pear-btn pear-btn-md" lay-submit lay-filter="table-reset">
										<i class="layui-icon layui-icon-refresh"></i>重置
								</button>
						</div>
						<div class="toggle-btn">
								<a class="layui-hide">展开<i class="layui-icon layui-icon-down"></i></a>
								<a class="layui-hide">收起<i class="layui-icon layui-icon-up"></i></a>
						</div>
				</form>
		</div>
</div>

<!-- 数据表格 -->
<div class="layui-card">
		<div class="layui-card-body">
				<table id="data-table" lay-filter="data-table"></table>
		</div>
</div>

<!-- 表格顶部工具栏 -->
<script type="text/html" id="table-toolbar">
		<button class="pear-btn pear-btn-primary pear-btn-md" lay-event="add" permission="admin.core.admin.create">
				<i class="layui-icon layui-icon-add-1"></i>新增
		</button>
		<button class="pear-btn pear-btn-danger pear-btn-md" lay-event="batchRemove" permission="admin.core.admin.delete">
				<i class="layui-icon layui-icon-delete"></i>删除
		</button>
</script>

<!-- 表格行工具栏 -->
<script type="text/html" id="table-bar">
		{{# if(d.show_toolbar){ }}
		<button class="pear-btn pear-btn-xs tool-btn" lay-event="edit" permission="admin.core.admin.update">编辑</button>
		<button class="pear-btn pear-btn-xs tool-btn" lay-event="remove" permission="admin.core.admin.delete">删除</button>
		{{# } }}
</script>

<script src="__LIB__/layui/layui.js?v=2.8.12"></script>
<script src="__LIB__/pear/pear.js"></script>
<script src="__ADMIN__/js/permission.js"></script>
<script src="__ADMIN__/js/common.js"></script>
<script>

    // 相关常量
    const PRIMARY_KEY = "id";
    const LIST_API = "/admin/core/admin/list";
    const UPDATE_API = "/admin/core/admin/update";
    const DELETE_API = "/admin/core/admin/delete";
    const CREATE_URL = "/admin/core/admin/create";
    const UPDATE_URL = "/admin/core/admin/update";

    // 字段 创建时间 create_at
    layui.use(["laydate"], function () {
        layui.laydate.render({
            elem: "#create_at",
            range: ["#create_at-date-start", "#create_at-date-end"],
        });
    })

    // 字段 状态 status
    layui.use(["jquery", "xmSelect", "popup", "responseCode"], function() {
        layui.$.ajax({
            url: "/admin/core/dict/get/status",
            dataType: "json",
            success: function (res) {
                let value = layui.$("#status").attr("value");
                let initValue = value ? value.split(",") : [];
                layui.xmSelect.render({
                    el: "#status",
                    name: "status",
                    initValue: initValue,
                    data: res.data,
                    model: {"icon":"hidden","label":{"type":"text"}},
                    clickClose: true,
                    radio: true,
                });
                if (res.code !== layui.responseCode.SUCCESS) {
                    layui.popup.failure(res.message);
                }
            }
        });
    });

    // 表格渲染
    layui.use(["table", "form", "common", "popup", "util"], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.$;
        let common = layui.common;
        let util = layui.util;

        // 表头参数
        let cols = [
            {type: "checkbox"},
            {title: "ID", field: "id", width: 100, sort: true,},
            {title: "用户名", field: "username",width: 200},
            {title: "昵称", field: "nickname",width: 200},
            {title: "密码", field: "password", hide: true,},
            {
                title: "头像", field: "avatar", width: 90, templet: function (d) {
                    return '<img src="' + encodeURI(d['avatar']) + '" style="max-width:32px;max-height:32px;" alt="" />'
                },

            },
            {title: "邮箱", field: "email", hide: true,},
            {title: "手机", field: "mobile", hide: true,},
            {title: "创建时间", field: "create_at", hide: true,},
            {title: "更新时间", field: "update_at", hide: true,},
            {title: "登录时间", field: "login_at",width: 220},
            {
                title: "角色", field: "roles", templet: function (d) {
                    return util.escape(d.roles.join(","));
                }
            },
            {
                title: "状态", field: "status", templet: function (d) {
                    let field = "status";
                    form.on("switch(" + field + ")", function (data) {
                        let load = layer.load();
                        let postData = {};
                        postData[field] = data.elem.checked ? 1 : 0;
                        postData[PRIMARY_KEY] = this.value;
                        $.post(UPDATE_API, postData, function (res) {
                            layer.close(load);
                            if (res.code !== layui.responseCode.SUCCESS) {
                                return layui.popup.failure(res.message, function () {
                                    data.elem.checked = !data.elem.checked;
                                    form.render();
                                });
                            }
                            return layui.popup.success("操作成功");
                        })
                    });
                    let checked = d[field] === 1 ? "checked" : "";
                    if (parent.Admin.Account.id === d.id) return '';
                    return '<input type="checkbox" value="' + util.escape(d[PRIMARY_KEY]) + '" lay-filter="' + util.escape(field) + '" lay-skin="switch" lay-text="' + util.escape('') + '" ' + checked + '/>';
                },
                width: 90,
            },
            {title: "操作", toolbar: "#table-bar", align: "center", fixed: "right", width: 130,}
        ];

        // 渲染表格
        table.render({
            elem: "#data-table",
            url: LIST_API,
            page: true,
            cols: [cols],
            skin: "line",
            size: "lg",
            toolbar: "#table-toolbar",
            autoSort: false,
            defaultToolbar: [{
                title: "刷新",
                layEvent: "refresh",
                icon: "layui-icon-refresh",
            }, "filter", "print", "exports"],
            done: function () {
                layer.photos({photos: 'div[lay-id="data-table"]', anim: 5});
            }
        });

        // 编辑或删除行事件
        table.on("tool(data-table)", function (obj) {
            if (obj.event === "remove") {
                remove(obj);
            } else if (obj.event === "edit") {
                edit(obj);
            }
        });

        // 表格顶部工具栏事件
        table.on("toolbar(data-table)", function (obj) {
            if (obj.event === "add") {
                add();
            } else if (obj.event === "refresh") {
                refreshTable();
            } else if (obj.event === "batchRemove") {
                batchRemove(obj);
            }
        });

        // 表格顶部搜索事件
        form.on("submit(table-query)", function (data) {
            table.reload("data-table", {
                page: {
                    curr: 1
                },
                where: data.field
            })
            return false;
        });

        // 表格顶部搜索重置事件
        form.on("submit(table-reset)", function (data) {
            table.reload("data-table", {
                where: []
            })
        });

        // 表格排序事件
        table.on("sort(data-table)", function (obj) {
            table.reload("data-table", {
                initSort: obj,
                scrollPos: "fixed",
                where: {
                    field: obj.field,
                    order: obj.type
                }
            });
        });

        // 表格新增数据
        let add = function () {
            layer.open({
                type: 2,
                title: "新增",
                shade: 0.1,
                area: [common.isModile() ? "100%" : "800px", common.isModile() ? "100%" : "600px"],
                content: CREATE_URL
            });
        }

        // 表格编辑数据
        let edit = function (obj) {
            let value = obj.data[PRIMARY_KEY];
            layer.open({
                type: 2,
                title: "修改",
                shade: 0.1,
                area: [common.isModile() ? "100%" : "800px", common.isModile() ? "100%" : "600px"],
                content: UPDATE_URL + "?" + PRIMARY_KEY + "=" + value
            });
        }

        // 删除一行
        let remove = function (obj) {
            return doRemove(obj.data[PRIMARY_KEY]);
        }

        // 删除多行
        let batchRemove = function (obj) {
            let checkIds = common.checkField(obj, PRIMARY_KEY);
            if (checkIds === "") {
                layui.popup.warning("未选中数据");
                return false;
            }
            doRemove(checkIds.split(","));
        }

        // 执行删除
        let doRemove = function (ids) {
            let data = {};
            data[PRIMARY_KEY] = ids;
            layer.confirm("确定删除?", {
                icon: 3,
                title: "提示"
            }, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: DELETE_API,
                    data: data,
                    dataType: "json",
                    type: "post",
                    success: function (res) {
                        layer.close(loading);
                        if (res.code) {
                            return layui.popup.failure(res.msg);
                        }
                        return layui.popup.success("操作成功", refreshTable);
                    }
                })
            });
        }

        // 刷新表格数据
        window.refreshTable = function () {
            table.reloadData("data-table", {
                scrollPos: "fixed",
                done: function (res, curr) {
                    if (curr > 1 && res.data && !res.data.length) {
                        curr = curr - 1;
                        table.reloadData("data-table", {
                            page: {
                                curr: curr
                            },
                        })
                    }
                }
            });
        }
    })

</script>
</body>
</html>
