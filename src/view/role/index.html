<!DOCTYPE html>
<html lang="zh-cn">
<head>
		<meta charset="utf-8">
		<title>浏览页面</title>
		<link rel="stylesheet" href="__LIB__/pear/css/pear.css"/>
		<link rel="stylesheet" href="__ADMIN__/css/reset.css"/>
</head>
<body class="pear-container">

<!-- 顶部查询表单 -->


<!-- 数据表格 -->
<div class="layui-card">
		<div class="layui-card-body">
				<table id="data-table" lay-filter="data-table"></table>
		</div>
</div>

<!-- 表格顶部工具栏 -->
<script type="text/html" id="table-toolbar">
		<button class="pear-btn pear-btn-primary pear-btn-md" lay-event="add" permission="app.admin.role.insert">
				<i class="layui-icon layui-icon-add-1"></i>新增
		</button>
		<button class="pear-btn pear-btn-danger pear-btn-md" lay-event="batchRemove" permission="app.admin.role.delete">
				<i class="layui-icon layui-icon-delete"></i>删除
		</button>
</script>

<!-- 表格行工具栏 -->
<script type="text/html" id="table-bar">
		{{# if(d.id!==1&&d.pid&&!d.isRoot){ }}
		<button class="pear-btn pear-btn-xs tool-btn" lay-event="edit" permission="app.admin.role.update">编辑</button>
		<button class="pear-btn pear-btn-xs tool-btn" lay-event="remove" permission="app.admin.role.delete">删除</button>
		{{# } }}
</script>

<script src="__LIB__/layui/layui.js?v=2.8.12"></script>
<script src="__LIB__/pear/pear.js"></script>
<script src="__ADMIN__/js/permission.js"></script>
<script src="__ADMIN__/js/common.js"></script>

<script>

    // 相关常量
    const PRIMARY_KEY = "id";
    const LIST_API = "/admin/core/role/list";
    const DELETE_API = "/admin/core/role/delete";
    const CREATE_URL = "/admin/core/role/create";
    const EDIT_URL = "/admin/core/role/edit";

    // 表格渲染
    layui.use(["table", "treetable", "form", "common", "popup", "util", "responseCode"], function () {
        let treeTable = layui.treetable;
        let table = layui.table;
        let form = layui.form;
        let $ = layui.$;
        let common = layui.common;
        let util = layui.util;

        // 表头参数
        let cols = [
            {type: "checkbox"},
            {title: "角色组", field: "title",},
            {title: "标识", field: "name",},
            {title: "主键", field: "id",},
            {
                title: "权限", field: "rules", templet: function (d) {
                    let field = "rules";
                    if (typeof d[field] == "undefined") return "";
                    let items = [];
                    layui.each((d[field] + "").split(","), function (k, v) {
                        items.push(apiResults[field][v] || v);
                    });
                    return util.escape(items.join(","));
                },
                hide: true,
            },
            {title: "创建时间", field: "create_at",},
            {title: "更新时间", field: "update_at",},
            {
                title: "父级", field: "pid", templet: function (d) {
                    let field = "pid";
                    if (typeof d[field] == "undefined") return "";
                    let items = [];
                    layui.each((d[field] + "").split(","), function (k, v) {
                        items.push(apiResults[field][v] || v);
                    });
                    return util.escape(items.join(","));
                },
                hide: true,
            },
            {title: "操作", toolbar: "#table-bar", align: "center", fixed: "right", width: 120,}
        ];

        // 渲染表格
        function render() {
            treeTable.render({
                elem: "#data-table",
                url: LIST_API,
                treeColIndex: 1,
                treeIdName: "id",
                treePidName: "pid",
                treeDefaultClose: false,
                cols: [cols],
                skin: "line",
                size: "lg",
                toolbar: "#table-toolbar",
                defaultToolbar: [{
                    title: "刷新",
                    layEvent: "refresh",
                    icon: "layui-icon-refresh",
                }, "filter", "print", "exports"]
            });
        }

        // 获取表格中下拉或树形组件数据
        let apis = [];
        apis.push(["rules", "/admin/core/node/get?type=0,1,2"]);
        apis.push(["pid", "/admin/core/role/list?format=select"]);

        let apiResults = {};
        apiResults["rules"] = {};
        apiResults["pid"] = {};

        let count = apis.length;
        let hasError = false;

        // 提取递归函数到外部，避免重复定义
        function travelData(items, targetArray) {
            for (let k in items) {
                let node = items[k]; // 改名避免混淆
                if (node.value !== undefined && node.name !== undefined) {
                    targetArray[node.value] = node.name;
                }
                if (node.children && node.children.length > 0) {
                    travelData(node.children, targetArray);
                }
            }
        }

        if (count === 0) {
            render();
        } else {
            layui.each(apis, function (k, item) {
                let [field, url] = item;
                $.ajax({
                    url: url,
                    dataType: "json",
                    success: function (res) {
                        if (res.code !== layui.responseCode.SUCCESS) {
                            hasError = true; // 标记错误
                            layui.popup.failure(res.message || "加载" + field + "失败");
                            return;
                        }
                        // 确保目标数组已初始化
                        if (!apiResults[field]) {
                            apiResults[field] = {};
                        }
                        travelData(res.data, apiResults[field]);
                    },
                    error: function () {
                        hasError = true;
                        layui.popup.failure("网络请求异常：" + field);
                    },
                    complete: function () {
                        if (--count === 0) {
                            if (!hasError) {
                                render();
                            } else {
                                console.warn("部分接口加载失败，已停止渲染。");
                            }
                        }
                    }
                });
            });
        }

        // 编辑或删除行事件
        table.on("tool(data-table)", function (obj) {
            if (obj.event === "remove") {
                remove(obj);
            } else if (obj.event === "edit") {
                edit(obj);
            }
        });

        // 表格顶部工具栏事件
        table.on("toolbar(data-table)", function (obj) {
            if (obj.event === "add") {
                add();
            } else if (obj.event === "refresh") {
                refreshTable();
            } else if (obj.event === "batchRemove") {
                batchRemove(obj);
            }
        });

        // 表格顶部搜索事件
        form.on("submit(table-query)", function (data) {
            table.reload("data-table", {
                page: {
                    curr: 1
                },
                where: data.field
            })
            return false;
        });

        // 表格顶部搜索重置事件
        form.on("submit(table-reset)", function (data) {
            table.reload("data-table", {
                where: []
            })
        });

        // 表格排序事件
        table.on("sort(data-table)", function (obj) {
            table.reload("data-table", {
                initSort: obj,
                scrollPos: "fixed",
                where: {
                    field: obj.field,
                    order: obj.type
                }
            });
        });

        // 表格新增数据
        let add = function () {
            layer.open({
                type: 2,
                title: "新增",
                shade: 0.1,
                area: [common.isModile() ? "100%" : "800px", common.isModile() ? "100%" : "600px"],
                content: CREATE_URL
            });
        }

        // 表格编辑数据
        let edit = function (obj) {
            let value = obj.data[PRIMARY_KEY];
            layer.open({
                type: 2,
                title: "修改",
                shade: 0.1,
                area: [common.isModile() ? "100%" : "800px", common.isModile() ? "100%" : "600px"],
                content: EDIT_URL + "?" + PRIMARY_KEY + "=" + value
            });
        }

        // 删除一行
        let remove = function (obj) {
            return doRemove(obj.data[PRIMARY_KEY]);
        }

        // 删除多行
        let batchRemove = function (obj) {
            let checkIds = common.checkField(obj, PRIMARY_KEY);
            if (checkIds === "") {
                layui.popup.warning("未选中数据");
                return false;
            }
            doRemove(checkIds.split(","));
        }

        // 执行删除
        let doRemove = function (ids) {
            let data = {};
            data[PRIMARY_KEY] = ids;
            layer.confirm("确定删除?", {
                icon: 3,
                title: "提示"
            }, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: DELETE_API,
                    data: data,
                    dataType: "json",
                    type: "post",
                    success: function (res) {
                        layer.close(loading);
                        if (res.code !== layui.responseCode.SUCCESS) {
                            return layui.popup.failure(res.message);
                        }
                        return layui.popup.success("操作成功", refreshTable);
                    }
                })
            });
        }

        // 刷新表格数据
        window.refreshTable = function () {
            table.reloadData("data-table", {
                scrollPos: "fixed",
                done: function (res, curr) {
                    if (curr > 1 && res.data && !res.data.length) {
                        curr = curr - 1;
                        table.reloadData("data-table", {
                            page: {
                                curr: curr
                            },
                        })
                    }
                }
            });
        }
    })

</script>
</body>
</html>
